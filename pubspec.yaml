name: rctool
description: "RcTool"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.2+2

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.1
  cupertino_icons: ^1.0.8
  audioplayers: ^6.1.0
  flutter_cache_manager: ^3.3.0
  flutter_local_notifications: ^17.2.4
  permission_handler: ^11.0.1
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.0
  sqflite_common_ffi_web: ^0.4.0
  path: ^1.9.0
  path_provider: ^2.1.5
  headset_connection_event: ^4.0.1
  shared_preferences: ^2.2.2
  webview_flutter: ^4.10.0
  webview_windows: ^0.4.0
  file_picker: 8.3.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: RcIcon
      fonts:
        - asset: fonts/iconfont.ttf
  assets:
    - image/RcTool.png
    - image/AboutBackGround.jpg
    - image/HomeBackGround.jpg
    - image/LivetodBackGround.jpg
    - image/MusicBackGround.jpg
    - image/Love.png
    - image/Expect.png
    - image/BottomBackGround.jpg
    - image/Reward.png
    - image/Mika.gif
    - image/ARoNa.png
    - image/Splash.png
    # Flutter 的目录声明只包含该目录下的直接文件，子目录必须逐个列出，
    # 否则 vendor 运行库与 Haru 模型不会被打进 APK。
    - assets/live2d/viewer/
    - assets/live2d/viewer/vendor/
    - assets/live2d/models/
    - assets/live2d/models/Haru/
    - assets/live2d/models/Haru/Haru.2048/
    - assets/live2d/models/Haru/expressions/
    - assets/live2d/models/Haru/motions/

flutter_launcher_icons:
  # 主图：全出血方形（遮罩由系统做，不要自带圆角/白边）
  image_path: "assets/icon/icon_full.png"
  android: true
  min_sdk_android: 21
  # 安卓 8+ 自适应图标：前景缩到 74% 居中留在安全区，背景取图标边缘渐变色
  adaptive_icon_background: "#B89A9C"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon_full.png"
    background_color: "#B89A9C"
    theme_color: "#B89A9C"
  windows:
    generate: true
    image_path: "assets/icon/icon_full.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon/icon_full.png"
